name: OPA LIB001 original SiEPIC GDS audit
on:
  pull_request:
    paths:
      - 'components/**'
      - 'tools/audit_siepic_lib001.py'
      - '.github/workflows/opa-lib001.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install klayout==0.30.6
      - run: python tools/audit_siepic_lib001.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: opa-lib-001
          path: results/opa-lib-001/
          if-no-files-found: error
