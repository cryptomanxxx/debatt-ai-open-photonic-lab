name: OPA archive NL019 evidence
on:
  workflow_dispatch:
    inputs:
      confirm_archive:
        description: Archive verified NL019 evidence to a separate review branch
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: opa-nl019-archive
  cancel-in-progress: false
jobs:
  archive:
    if: github.ref == 'refs/heads/main' && inputs.confirm_archive == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ARCHIVE_BRANCH: research/opa-nl019-44409237897
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify run and artifact identity
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44409237897" |
            jq -e '.path == ".github/workflows/experiments.yml" and .head_branch == "research/opa-nl-019" and .event == "pull_request" and .conclusion == "success" and .head_sha == "3ea0d1ede9610f42a3c06ebf2602b82d909dc437"' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14475309037" |
            jq -e '.name == "opa-nl-019" and .expired == false and .workflow_run.id == 44409237897 and .digest == "sha256:17a7ed1175c4fdee87539eadd7e9999f4f7d54c9ce55556be656cf0029672d40" and .size_in_bytes == 169652' >/dev/null
      - name: Download and verify raw ZIP
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14475309037/zip" > "$RUNNER_TEMP/nl019.zip"
          python3 research/archive_nl019.py --zip "$RUNNER_TEMP/nl019.zip" --output results/opa-nl-019
      - name: Archive to separate review branch
        run: |
          gh auth setup-git
          if git ls-remote --exit-code --heads origin "refs/heads/$ARCHIVE_BRANCH" >/dev/null; then
            echo "Archive branch exists; refusing overwrite."
            exit 1
          else
            status=$?
            [[ "$status" == 2 ]]
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$ARCHIVE_BRANCH"
          git -c core.autocrlf=false add -f -- results/opa-nl-019
          stage="$RUNNER_TEMP/nl019-staged"
          mkdir "$stage"
          for file in results/opa-nl-019/*; do
            git show ":$file" > "$stage/$(basename "$file")"
          done
          python3 research/archive_nl019.py --zip "$RUNNER_TEMP/nl019.zip" --staged "$stage"
          git commit -m "Archive exact OPA-NL-019 evidence from run 44409237897"
          git push origin "HEAD:refs/heads/$ARCHIVE_BRANCH"
          echo "Review branch: https://github.com/$GITHUB_REPOSITORY/compare/main...$ARCHIVE_BRANCH" >> "$GITHUB_STEP_SUMMARY"
