name: Archive scientific experiment
on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      merged_pr:
        description: Merged PR number for automatic discovery (leave other fields blank)
        required: false
        type: string
      experiment:
        description: Registered experiment ID
        required: false
        type: string
      source_run:
        description: Successful Experiments workflow run ID
        required: false
        type: string
      source_artifact:
        description: Exact source artifact ID
        required: false
        type: string
      source_sha:
        description: Full source run head SHA (PR head for pull_request; must be ancestor of main)
        required: false
        type: string
      files:
        description: Manual mode only — reviewed complete ZIP file allowlist
        required: false
        type: string
        default: result.json,results.csv,environment-lock.txt,installed-packages.json
      confirm_public_archive:
        description: I reviewed the source files and authorize permanent public archival
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  archive:
    if: >-
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       !startsWith(github.event.pull_request.head.ref, 'archive/scientific/')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_public_archive)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      pull-requests: write
    concurrency:
      group: scientific-archive
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      ARCHIVE_PR: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || inputs.merged_pr }}
      ARCHIVE_EXPERIMENT: ${{ inputs.experiment }}
      SOURCE_RUN: ${{ inputs.source_run }}
      SOURCE_ARTIFACT: ${{ inputs.source_artifact }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      ARCHIVE_FILES: ${{ inputs.files }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Discover approved public experiment artifact
        id: discover
        if: env.ARCHIVE_PR != ''
        run: python3 tools/archive_discovery.py
      - name: Verify source and stage exact original files
        if: env.ARCHIVE_PR == '' || steps.discover.outputs.found == 'true'
        run: python3 tools/archive_experiment.py
      - name: Publish review branch and request review
        if: env.ARCHIVE_PR == '' || steps.discover.outputs.found == 'true'
        run: |
          set -euo pipefail
          branch="archive/scientific/$ARCHIVE_EXPERIMENT-$SOURCE_RUN-$SOURCE_ARTIFACT"
          git check-ref-format "refs/heads/$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "Archive original $ARCHIVE_EXPERIMENT artifact $SOURCE_ARTIFACT"
          gh auth setup-git
          # Empty expected old ref: atomically refuse to update any existing branch.
          git push --force-with-lease="refs/heads/$branch:" origin "HEAD:refs/heads/$branch"
          manifest="results/ci-originals/$ARCHIVE_EXPERIMENT/$SOURCE_RUN-$SOURCE_ARTIFACT/archive-provenance.json"
          executed=$(jq -er .executed_commit_sha "$manifest")
          tree=$(jq -er .executed_tree_sha "$manifest")
          body="$RUNNER_TEMP/archive-pr-body.md"
          cat > "$body" <<EOF
          ## Debatt-AI Scientific Archive Bot

          This pull request was automatically generated by the Debatt-AI Scientific Archive Bot.

          | Provenance | Value |
          |---|---|
          | Experiment | $ARCHIVE_EXPERIMENT |
          | Source run | [$SOURCE_RUN](https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN) |
          | Artifact ID | $SOURCE_ARTIFACT |
          | Source run head SHA (PR head for PR runs) | $SOURCE_SHA |
          | Executed checkout SHA | $executed |
          | Executed tree SHA | $tree |
          | SHA-256 verification | Passed |
          | ZIP integrity (CRC) | Passed |
          | Original files modified | No |
          | Experiment rerun | No |

          **Human review required.** Review archive-provenance.json and public-data suitability. Confirm required CI and Codex checks before merging.

          This bot does not approve or merge pull requests.
          EOF
          if ! pr_url=$(gh pr create --base main --head "$branch" \
            --title "[Archive Bot] Automated Scientific Archive – $ARCHIVE_EXPERIMENT" \
            --body-file "$body"); then
            echo "::warning::Branch pushed. PR creation failed; check repository Actions PR permissions and open the PR manually."
            echo "Open https://github.com/$GITHUB_REPOSITORY/compare/main...$branch?expand=1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Archive PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"
          # The PR exists even if the review request fails. Do not retry archival.
          if [[ "$pr_url" == "https://github.com/$GITHUB_REPOSITORY/pull/"* ]] &&
             [[ "${pr_url##*/}" =~ ^[0-9]+$ ]] && \
             gh pr comment "$pr_url" --repo "$GITHUB_REPOSITORY" --body '@codex review'; then
            echo "Codex request comment posted; actual review acceptance/completion is not verified." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Could not post Codex request. Request review manually on the archive PR."
            echo "Request Codex review manually on the archive PR." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Approve pending PR workflows if GitHub requires it. Verify CI and Codex before manual merge." >> "$GITHUB_STEP_SUMMARY"
