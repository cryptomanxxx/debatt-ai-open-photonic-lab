name: OPA archive NL012 evidence
on:
  workflow_dispatch:
    inputs:
      confirm_archive:
        description: Archive verified NL012 evidence to a separate review branch
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: opa-nl012-archive
  cancel-in-progress: false
jobs:
  archive:
    if: github.ref == 'refs/heads/main' && inputs.confirm_archive == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ARCHIVE_BRANCH: research/opa-nl012-44296016894
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify run and artifact identity
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44296016894" |
            jq -e '.path == ".github/workflows/experiments.yml" and .head_branch == "research/opa-nl-012" and .event == "pull_request" and .conclusion == "success" and .head_sha == "ab30ce5c9a89a13fb6d2299884ba6f4c5e899cc6"' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14425195090" |
            jq -e '.name == "opa-nl-012" and .expired == false and .workflow_run.id == 44296016894 and .digest == "sha256:1744fb578163f69d8a35b5fd35a1a0354cecbef3146d7177fc1bb1c28f8e5daf" and .size_in_bytes == 2838736' >/dev/null
      - name: Download and verify raw ZIP
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14425195090/zip" > "$RUNNER_TEMP/nl012.zip"
          python3 research/archive_nl012.py --zip "$RUNNER_TEMP/nl012.zip" --output results/opa-nl-012
      - name: Archive to separate review branch
        run: |
          gh auth setup-git
          if git ls-remote --exit-code --heads origin "refs/heads/$ARCHIVE_BRANCH" >/dev/null; then
            echo "Archive branch exists; refusing overwrite."
            exit 1
          else
            status=$?
            [[ "$status" == 2 ]]
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$ARCHIVE_BRANCH"
          git -c core.autocrlf=false add -f -- results/opa-nl-012
          stage="$RUNNER_TEMP/nl012-staged"
          mkdir "$stage"
          for file in results/opa-nl-012/*; do
            git show ":$file" > "$stage/$(basename "$file")"
          done
          python3 research/archive_nl012.py --zip "$RUNNER_TEMP/nl012.zip" --staged "$stage"
          git commit -m "Archive exact OPA-NL-012 evidence from run 44296016894"
          git push origin "HEAD:refs/heads/$ARCHIVE_BRANCH"
          echo "Review branch: https://github.com/$GITHUB_REPOSITORY/compare/main...$ARCHIVE_BRANCH" >> "$GITHUB_STEP_SUMMARY"
