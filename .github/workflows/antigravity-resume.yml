name: AG-PHOTONIC-001 resume
on:
  workflow_dispatch:
    inputs:
      token_budget:
        description: 'Requested agent token budget (20000–200000)'
        required: true
        type: number
        default: 200000
      confirm_free_project:
        description: 'I verified Free Tier and billing disabled'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: antigravity-live-probe
  cancel-in-progress: false
jobs:
  resume:
    if: github.ref == 'refs/heads/main' && inputs.confirm_free_project == true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s antigravity/tests
      - name: Resume existing interaction once
        env:
          AG_TOKEN_BUDGET: ${{ inputs.token_budget }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AG_PREVIOUS_INTERACTION_ID: ${{ secrets.AG_PREVIOUS_INTERACTION_ID }}
          AG_ENVIRONMENT_ID: ${{ secrets.AG_ENVIRONMENT_ID }}
        run: python3 antigravity/experiments/AG-PHOTONIC-001/resume.py --token-budget "$AG_TOKEN_BUDGET" --live --confirm-free-project
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: AG-PHOTONIC-001-continuation
          path: antigravity/results/AG-PHOTONIC-001-*.json
          if-no-files-found: warn
          retention-days: 7
