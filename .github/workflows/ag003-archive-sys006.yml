name: AG003 archive SYS006 evidence
on:
  workflow_dispatch:
    inputs:
      confirm_archive:
        description: Archive exact SYS006 evidence to a separate review branch
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: ag003-sys006-archive
  cancel-in-progress: false
jobs:
  archive:
    if: github.ref == 'refs/heads/main' && inputs.confirm_archive == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ROOT: antigravity/reproduction/AG-PHOTONIC-003
      ARCHIVE_BRANCH: research/ag003-sys006-44125011406
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify run and artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44125011406" |
            jq -e '.path == ".github/workflows/experiments.yml" and .head_branch == "research/opa-sys-006-convergence" and .event == "pull_request" and .conclusion == "success" and .head_sha == "a44a5fd40c396b54e84104592b415b76038f3930"' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14347985409" |
            jq -e '.name == "opa-sys-006" and .expired == false and .workflow_run.id == 44125011406 and .digest == "sha256:dbf45cf71e8d3d1faaafb171badba61f6156b6345be28b8de1370c06eb47187e" and .size_in_bytes == 220764' >/dev/null
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: 14347985409
          run-id: 44125011406
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ag003-sys006-evidence
          merge-multiple: true
      - name: Verify exact artifact files
        run: |
          python3 "$ROOT/archive_sys006.py" --source "$RUNNER_TEMP/ag003-sys006-evidence" --output results/opa-sys-006
      - name: Archive to separate review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          if git ls-remote --exit-code --heads origin "refs/heads/$ARCHIVE_BRANCH" >/dev/null; then
            echo "Archive branch exists; refusing overwrite."
            exit 1
          else
            status=$?
            [[ "$status" == 2 ]]
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$ARCHIVE_BRANCH"
          git -c core.autocrlf=false add -f -- results/opa-sys-006
          stage="$RUNNER_TEMP/ag003-sys006-staged"
          mkdir "$stage"
          for file in results/opa-sys-006/*; do
            git show ":$file" > "$stage/$(basename "$file")"
          done
          python3 "$ROOT/archive_sys006.py" --source "$stage" --staged
          git commit -m "Archive exact OPA-SYS-006 evidence from run 44125011406"
          git push origin "HEAD:refs/heads/$ARCHIVE_BRANCH"
          echo "Review branch: https://github.com/$GITHUB_REPOSITORY/compare/main...$ARCHIVE_BRANCH" >> "$GITHUB_STEP_SUMMARY"
