name: OPA coupler sensitivity v003

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/meep-coupler-sensitivity-v003.yml"
      - "simulations/meep/coupler_sensitivity_v003.py"
      - "simulations/meep/geometry/coupler_gap0.236.json"
      - "results/opa-coupler-002/result.json"
      - "simulations/meep/opa-fdtd-linux-64.lock.txt"

permissions:
  contents: read

jobs:
  coupler-sensitivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: micromamba-shell {0}
    steps:
      - uses: actions/checkout@v4
      - name: Install locked Meep
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: opa-fdtd
          create-args: >-
            --file simulations/meep/opa-fdtd-linux-64.lock.txt
      - name: Archive environment provenance
        run: |
          mkdir -p results/opa-coupler-003
          cp simulations/meep/opa-fdtd-linux-64.lock.txt results/opa-coupler-003/environment-lock.txt
          micromamba list -n opa-fdtd --json > results/opa-coupler-003/installed-packages.json
      - name: Run coupler sensitivity analysis
        run: python simulations/meep/coupler_sensitivity_v003.py
      - name: Upload measurement results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opa-coupler-003
          path: results/opa-coupler-003/
          if-no-files-found: warn
