name: Photonic Circuit Lab

on:
  pull_request:
    paths:
      - 'web/chip13/**'
      - 'web/chip14/**'
      - 'web/chip15/**'
      - 'web/chip16/**'
      - 'web/opa-w/**'
      - '.github/workflows/photonic-circuit-lab.yml'
  push:
    branches: [main]
    paths:
      - 'web/chip13/**'
      - 'web/chip14/**'
      - 'web/chip15/**'
      - 'web/chip16/**'
      - 'web/opa-w/**'
      - '.github/workflows/photonic-circuit-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Numerical model regressions
        run: node --test web/opa-w/model.test.mjs web/chip16/model.test.cjs
      - name: Install test browser
        run: |
          npm install --prefix "$RUNNER_TEMP/opa-w-tests" --no-audit --no-fund --save-exact playwright@1.56.1
          "$RUNNER_TEMP/opa-w-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser interaction and layout tests
        run: NODE_PATH="$RUNNER_TEMP/opa-w-tests/node_modules" node --test web/opa-w/browser.test.cjs
