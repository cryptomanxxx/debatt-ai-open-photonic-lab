name: OPA CIR006 lnoi400 model audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/audit_lnoi400_cir006.py"
      - "tools/audit_lnoi400_cir005.py"
      - "tools/audit_lnoi400_cir004.py"
      - "tools/audit_lnoi400_cir003.py"
      - "simulations/circuit/mesh.py"
      - "simulations/circuit/mzi.py"
      - "results/opa-mzi-003/result.json"
      - "tools/audit_lnoi400_cir002.py"
      - "results/opa-layout-005/result.json"
      - "simulations/circuit/scattering_network.py"
      - "layout/requirements-lock-lnoi400.txt"
      - "research/OPA-CIR-006.md"
      - ".github/workflows/opa-cir006-lnoi400.yml"
permissions:
  contents: read
  actions: read
env:
  LXT_PDK_COMMIT: d16db6a4882657feb1ce696c16c604ff6cb7ccfa
  JAX_ENABLE_X64: "true"
  JAX_PLATFORMS: cpu
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install existing locked PDK environment
        run: |
          pip install -r layout/requirements-lock-lnoi400.txt
          git clone --quiet https://github.com/Luxtelligence/lxt_pdk_gf "$RUNNER_TEMP/lxt_pdk_gf"
          git -C "$RUNNER_TEMP/lxt_pdk_gf" checkout --quiet "$LXT_PDK_COMMIT"
          test "$(git -C "$RUNNER_TEMP/lxt_pdk_gf" rev-parse HEAD)" = "$LXT_PDK_COMMIT"
          pip install --no-deps -e "$RUNNER_TEMP/lxt_pdk_gf"
          if pip show gdsfactoryplus >/dev/null 2>&1; then exit 1; fi
      - name: Fetch exact CIR005 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14524868669" | jq -e '.name == "opa-cir-005" and .workflow_run.id == 44516404174 and .digest == "sha256:0cd9d5eacdf5be4fcf4481809a5a96e1391aef40a9d0862d0d450dddb06f8dff" and .expired == false' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14524868669/zip" > "$RUNNER_TEMP/cir005.zip"
      - name: Audit PDK and cross-check circuit assembly
        env:
          LXT_PDK_DIR: ${{ runner.temp }}/lxt_pdk_gf
          CIR005_ZIP: ${{ runner.temp }}/cir005.zip
        run: |
          mkdir -p results/opa-cir-006
          cp layout/requirements-lock-lnoi400.txt results/opa-cir-006/environment-lock.txt
          pip list --format=json > results/opa-cir-006/installed-packages.json
          python tools/audit_lnoi400_cir006.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: opa-cir-006
          path: results/opa-cir-006/
          if-no-files-found: error
