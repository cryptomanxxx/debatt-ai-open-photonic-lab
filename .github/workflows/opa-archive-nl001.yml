name: OPA archive NL001 evidence
on:
  workflow_dispatch:
    inputs:
      confirm_archive:
        description: Archive verified NL001 evidence to a separate review branch
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: opa-nl001-archive
  cancel-in-progress: false
jobs:
  archive:
    if: github.ref == 'refs/heads/main' && inputs.confirm_archive == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ARCHIVE_BRANCH: research/opa-nl001-44153775276
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify run and artifact identity
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44153775276" |
            jq -e '.path == ".github/workflows/experiments.yml" and .head_branch == "research/opa-nl-001" and .event == "pull_request" and .conclusion == "success" and .head_sha == "eaf191ad531beaee8b87df5048f151fbc5f6a81b"' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14360875814" |
            jq -e '.name == "opa-nl-001" and .expired == false and .workflow_run.id == 44153775276 and .digest == "sha256:effb57fcb56dfb8433951bff8ff3d381f8e6bfaab31c51d54c0340751c4c9cc3" and .size_in_bytes == 102722' >/dev/null
      - name: Download and verify raw ZIP
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14360875814/zip" > "$RUNNER_TEMP/nl001.zip"
          python3 research/archive_nl001.py --zip "$RUNNER_TEMP/nl001.zip" --output results/opa-nl-001
      - name: Archive to separate review branch
        run: |
          gh auth setup-git
          if git ls-remote --exit-code --heads origin "refs/heads/$ARCHIVE_BRANCH" >/dev/null; then
            echo "Archive branch exists; refusing overwrite."
            exit 1
          else
            status=$?
            [[ "$status" == 2 ]]
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$ARCHIVE_BRANCH"
          git -c core.autocrlf=false add -f -- results/opa-nl-001
          stage="$RUNNER_TEMP/nl001-staged"
          mkdir "$stage"
          for file in results/opa-nl-001/*; do
            git show ":$file" > "$stage/$(basename "$file")"
          done
          python3 research/archive_nl001.py --zip "$RUNNER_TEMP/nl001.zip" --staged "$stage"
          git commit -m "Archive exact OPA-NL-001 evidence from run 44153775276"
          git push origin "HEAD:refs/heads/$ARCHIVE_BRANCH"
          echo "Review branch: https://github.com/$GITHUB_REPOSITORY/compare/main...$ARCHIVE_BRANCH" >> "$GITHUB_STEP_SUMMARY"
