name: Antigravity experiment manager
on:
  workflow_dispatch:
    inputs:
      experiment:
        type: choice
        options: [AG-PHOTONIC-001, AG-INFRA-001, AG-PHOTONIC-002, AG-PHOTONIC-003]
      mode:
        type: choice
        options: [retrieve, import, start]
        default: retrieve
      prior_run_id:
        description: Optional historical run ID; blank selects latest checkpoint
        type: string
      token_budget:
        type: number
        default: 20000
      confirm_new_submission:
        type: boolean
        default: false
      confirm_free_project:
        description: I verified Free Tier and billing disabled
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: antigravity-live-probe
  cancel-in-progress: false
jobs:
  manager:
    if: github.ref == 'refs/heads/main' && inputs.confirm_free_project == true && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate inputs
        env:
          MODE: ${{ inputs.mode }}
          PRIOR: ${{ inputs.prior_run_id }}
          CONFIRM: ${{ inputs.confirm_new_submission }}
        run: |
          if [[ "$MODE" == retrieve ]]; then
            [[ -z "$PRIOR" || "$PRIOR" =~ ^[0-9]+$ ]]
          else
            [[ -z "$PRIOR" ]]
          fi
          if [[ "$MODE" == start ]]; then
            [[ "$CONFIRM" == true ]]
          fi
      - name: Install encryption dependency
        run: sudo apt-get update -qq && sudo apt-get install -y python3-cryptography
      - run: /usr/bin/python3 -m unittest discover -s antigravity/tests
      - name: Select checkpoint
        id: checkpoint
        if: inputs.mode == 'retrieve'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPERIMENT: ${{ inputs.experiment }}
          PRIOR: ${{ inputs.prior_run_id }}
        run: /usr/bin/python3 antigravity/checkpoints.py --experiment "$EXPERIMENT" --prior "$PRIOR"
      - uses: actions/download-artifact@v7
        if: inputs.mode == 'retrieve' && steps.checkpoint.outputs.archive != 'true'
        with:
          name: ${{ steps.checkpoint.outputs.artifact_name }}
          run-id: ${{ steps.checkpoint.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ag-prior
      - name: Restore permanent checkpoint
        if: inputs.mode == 'retrieve' && steps.checkpoint.outputs.archive == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AG_ARCHIVE_KEY: ${{ secrets.AG_ARCHIVE_KEY }}
          EXPERIMENT: ${{ inputs.experiment }}
        run: |
          git fetch origin refs/heads/antigravity-archive
          git worktree add --detach "$RUNNER_TEMP/archive-tree" FETCH_HEAD
          /usr/bin/python3 antigravity/archive.py restore --root "$RUNNER_TEMP/archive-tree/antigravity/archive" --experiment "$EXPERIMENT" --file "$RUNNER_TEMP/ag-prior/checkpoint.enc"
      - name: Execute one operation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AG_RETRIEVE_INTERACTION_ID: ${{ secrets.AG_RETRIEVE_INTERACTION_ID }}
          MODE: ${{ inputs.mode }}
          EXPERIMENT: ${{ inputs.experiment }}
          BUDGET: ${{ inputs.token_budget }}
          CONFIRM: ${{ inputs.confirm_new_submission }}
        run: |
          args=()
          if [[ "$MODE" == retrieve ]]; then
            args+=(--prior "$RUNNER_TEMP/ag-prior/checkpoint.enc")
          fi
          if [[ "$CONFIRM" == true ]]; then
            args+=(--allow-submit)
          fi
          /usr/bin/python3 antigravity/manager.py --experiment "$EXPERIMENT" --mode "$MODE" --budget "$BUDGET" --output "$RUNNER_TEMP/ag-output/checkpoint.enc" --confirm-free-project "${args[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: antigravity-encrypted-checkpoint-${{ inputs.experiment }}
          path: ${{ runner.temp }}/ag-output/checkpoint.enc
          retention-days: 90
          if-no-files-found: warn
