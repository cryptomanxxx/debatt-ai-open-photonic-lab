name: OPA LIB005 permanent BDC negative evidence audit
on:
  pull_request:
    paths:
      - 'components/comparison/lib005-bdc-evidence/**'
      - 'components/comparison/lib005-bdc-archive-source.json'
      - 'research/archive_lib005_bdc.py'
      - '.github/workflows/opa-lib005-bdc-evidence-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install audited numerical dependency
        run: python3 -m pip install --break-system-packages numpy==2.2.6
      - name: Verify Git-committed archive without expiring CI artifacts
        run: |
          set -euo pipefail
          root=components/comparison/lib005-bdc-evidence
          if ! git cat-file -e "HEAD:$root/d1/original.zip"; then
            test -z "$(git ls-files -- "$root")"
            echo "Evidence archive pending; original artifacts verified separately by preflight."
            exit 0
          fi
          stage="$RUNNER_TEMP/lib005-bdc-permanent"
          mkdir "$stage"
          git ls-files -z -- "$root" | while IFS= read -r -d '' file; do
            rel="${file#$root/}"
            mkdir -p "$stage/$(dirname "$rel")"
            git show "HEAD:$file" > "$stage/$rel"
          done
          python3 research/archive_lib005_bdc.py --staged "$stage"
