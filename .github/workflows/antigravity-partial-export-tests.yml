name: Antigravity partial export tests
on:
  pull_request:
    paths:
      - 'antigravity/**'
      - '.github/workflows/antigravity-scientific-export.yml'
      - '.github/workflows/antigravity-partial-export-tests.yml'
  push:
    branches: [main]
    paths:
      - 'antigravity/**'
      - '.github/workflows/antigravity-scientific-export.yml'
      - '.github/workflows/antigravity-partial-export-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y python3-cryptography
      - run: /usr/bin/python3 -m unittest discover -s antigravity/tests
