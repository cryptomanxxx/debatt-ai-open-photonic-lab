name: OPA layout SiEPIC EBeam

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/layout-ubc.yml"
      - "layout/mzi_2x2_ubc_v00*.py"
      - "layout/requirements-lock-ubc.txt"
      - "layout/requirements-drc.txt"
      - "tools/siepic_drc.py"
  pull_request:
    paths:
      - ".github/workflows/layout-ubc.yml"
      - "layout/mzi_2x2_ubc_v00*.py"
      - "layout/requirements-lock-ubc.txt"
      - "layout/requirements-drc.txt"
      - "results/opa-layout-002/**"
      - "results/opa-layout-003/**"
      - "tools/siepic_drc.py"
      - "tools/test_siepic_drc.py"

permissions:
  contents: read

jobs:
  layout:
    name: ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: opa-layout-002
            script: layout/mzi_2x2_ubc_v002.py
            gds: results/opa-layout-002/mzi_2x2_siepic.gds
          - id: opa-layout-003
            script: layout/mzi_2x2_ubc_v003.py
            gds: results/opa-layout-003/mzi_2x2_siepic_full.gds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked SiEPIC layout environment (no proprietary packages)
        run: |
          pip install -r layout/requirements-lock-ubc.txt
          if pip show gdsfactoryplus >/dev/null 2>&1; then echo "gdsfactoryplus must not be installed"; exit 1; fi
      - name: Install KLayout 0.28.16 (DRC engine)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends klayout=0.28.16-0ubuntu0.24.04.1
          QT_QPA_PLATFORM=offscreen klayout -v
      - name: DRC tool finds known violations
        run: python tools/test_siepic_drc.py
      - name: Generate layout and run checks
        env:
          MPLBACKEND: Agg
        run: python ${{ matrix.script }}
      - name: Committed GDS and datasheet match the generated ones
        env:
          GDS: ${{ matrix.gds }}
          ID: ${{ matrix.id }}
        run: git diff --exit-code -- "$GDS" "results/$ID/design.json"
      - name: Upload layout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: results/${{ matrix.id }}/
          if-no-files-found: warn
