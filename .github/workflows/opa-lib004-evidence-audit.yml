name: OPA LIB004 permanent evidence audit
on:
  pull_request:
    paths:
      - 'components/experimentally_validated/SiEPIC-PCM-2020-02-UW/archive/**'
      - 'components/experimentally_validated/SiEPIC-PCM-2020-02-UW/archive-source.json'
      - 'components/experimentally_validated/SiEPIC-PCM-2020-02-UW/manifest.json'
      - 'components/experimentally_validated/SiEPIC-PCM-2020-02-UW/LICENSE.md'
      - 'components/experimentally_validated/SiEPIC-PCM-2020-02-UW/original/**'
      - 'components/experimentally_validated/SiEPIC-PCM-2020-02-UW/upstream/**'
      - 'research/archive_lib004.py'
      - '.github/workflows/opa-lib004-evidence-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify exact archived Git bytes when present
        run: |
          set -euo pipefail
          root=components/experimentally_validated/SiEPIC-PCM-2020-02-UW/archive
          if ! git cat-file -e "HEAD:$root/original.zip"; then
            test -z "$(git ls-files -- "$root")"
            echo "Archive not yet committed; preflight is separate."
            exit 0
          fi
          stage="$RUNNER_TEMP/lib004-committed"
          mkdir "$stage"
          git ls-files -z -- "$root" | while IFS= read -r -d '' file; do
            rel="${file#$root/}"
            mkdir -p "$stage/$(dirname "$rel")"
            git show "HEAD:$file" > "$stage/$rel"
          done
          python3 research/archive_lib004.py --source "$stage/original.zip" --staged "$stage"
