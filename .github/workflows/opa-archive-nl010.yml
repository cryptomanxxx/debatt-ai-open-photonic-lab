name: OPA archive NL010 evidence
on:
  workflow_dispatch:
    inputs:
      confirm_archive:
        description: Archive verified NL010 evidence to a separate review branch
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: opa-nl010-archive
  cancel-in-progress: false
jobs:
  archive:
    if: github.ref == 'refs/heads/main' && inputs.confirm_archive == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ARCHIVE_BRANCH: research/opa-nl010-44283625212
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify run and artifact identity
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44283625212" |
            jq -e '.path == ".github/workflows/experiments.yml" and .head_branch == "research/opa-nl-010" and .event == "pull_request" and .conclusion == "success" and .head_sha == "f2e818606a84963f665267797c4f6b72bf9b86a1"' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14418487339" |
            jq -e '.name == "opa-nl-010" and .expired == false and .workflow_run.id == 44283625212 and .digest == "sha256:e1647c33b2e3b6d85c7f7f26cdd31d18c869285c899c9ef567a5c5dc196fa80e" and .size_in_bytes == 475556' >/dev/null
      - name: Download and verify raw ZIP
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14418487339/zip" > "$RUNNER_TEMP/nl010.zip"
          python3 research/archive_nl010.py --zip "$RUNNER_TEMP/nl010.zip" --output results/opa-nl-010
      - name: Archive to separate review branch
        run: |
          gh auth setup-git
          if git ls-remote --exit-code --heads origin "refs/heads/$ARCHIVE_BRANCH" >/dev/null; then
            echo "Archive branch exists; refusing overwrite."
            exit 1
          else
            status=$?
            [[ "$status" == 2 ]]
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$ARCHIVE_BRANCH"
          git -c core.autocrlf=false add -f -- results/opa-nl-010
          stage="$RUNNER_TEMP/nl010-staged"
          mkdir "$stage"
          for file in results/opa-nl-010/*; do
            git show ":$file" > "$stage/$(basename "$file")"
          done
          python3 research/archive_nl010.py --zip "$RUNNER_TEMP/nl010.zip" --staged "$stage"
          git commit -m "Archive exact OPA-NL-010 evidence from run 44283625212"
          git push origin "HEAD:refs/heads/$ARCHIVE_BRANCH"
          echo "Review branch: https://github.com/$GITHUB_REPOSITORY/compare/main...$ARCHIVE_BRANCH" >> "$GITHUB_STEP_SUMMARY"
