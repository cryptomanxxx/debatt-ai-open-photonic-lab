name: AG003 source recovery
on:
  workflow_dispatch:
    inputs:
      confirm_free_project:
        description: Verified free tier and billing disabled; authorize one source-only follow-up
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: antigravity-live-probe
  cancel-in-progress: false
jobs:
  recover:
    if: github.ref == 'refs/heads/main' && inputs.confirm_free_project == true && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y python3-cryptography
      - uses: actions/download-artifact@v7
        with:
          name: antigravity-encrypted-checkpoint-AG-PHOTONIC-003
          run-id: 43993099721
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ag-prior
      - name: Request existing files only
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          /usr/bin/python3 antigravity/reproduction/AG-PHOTONIC-003/recover_workspace.py --prior "$RUNNER_TEMP/ag-prior/checkpoint.enc" --output "$RUNNER_TEMP/ag-output/checkpoint.enc" --confirm-free-project
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: antigravity-encrypted-checkpoint-AG-PHOTONIC-003
          path: ${{ runner.temp }}/ag-output/checkpoint.enc
          retention-days: 90
          if-no-files-found: warn
