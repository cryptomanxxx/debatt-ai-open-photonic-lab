name: OPA Meep 3D bend launched-mode v011

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/meep-bend-launched-mode-v011.yml"
      - "simulations/meep/bend_3d_launched_mode_v011.py"
      - "simulations/meep/opa_common.py"
      - "simulations/meep/opa-fdtd-linux-64.lock.txt"

permissions:
  contents: read

jobs:
  modal-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: micromamba-shell {0}
    steps:
      - uses: actions/checkout@v4
      - name: Install locked Meep
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: opa-fdtd
          create-args: >-
            --file simulations/meep/opa-fdtd-linux-64.lock.txt
      - name: Archive environment provenance
        run: |
          mkdir -p results/opa-fdtd-011
          cp simulations/meep/opa-fdtd-linux-64.lock.txt results/opa-fdtd-011/environment-lock.txt
          micromamba list -n opa-fdtd --json > results/opa-fdtd-011/installed-packages.json
      - name: Run guided-mode bend experiment
        run: python simulations/meep/bend_3d_launched_mode_v011.py
      - name: Upload measurement results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opa-meep-bend-launched-mode-v011
          path: results/opa-fdtd-011/
          if-no-files-found: warn
