name: AG003 recovery diagnostics
on:
  workflow_dispatch:
    inputs:
      recovery_run_id:
        description: Completed source recovery workflow run (including failed jobs)
        type: string
        default: '44058629986'
      confirm_public_metadata:
        description: Publish only status, usage and bounded evidence counts
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    if: github.ref == 'refs/heads/main' && inputs.confirm_public_metadata == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y python3-cryptography
      - run: /usr/bin/python3 -m unittest discover -s antigravity/tests
      - name: Validate recovery run provenance
        env:
          PRIOR: ${{ inputs.recovery_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$PRIOR" =~ ^[0-9]{1,20}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR" |
            jq -e '.path == ".github/workflows/ag003-source-recovery.yml" and .head_branch == "main" and .event == "workflow_dispatch" and .status == "completed"' >/dev/null
      - uses: actions/download-artifact@v7
        with:
          name: antigravity-encrypted-checkpoint-AG-PHOTONIC-003
          run-id: 43993099721
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ag-original
      - uses: actions/download-artifact@v7
        with:
          name: ag003-source-recovery-encrypted
          run-id: ${{ inputs.recovery_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ag-recovery
      - name: Diagnose locally (no Google requests)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PRIOR: ${{ inputs.recovery_run_id }}
        run: |
          /usr/bin/python3 antigravity/reproduction/AG-PHOTONIC-003/diagnose_recovery.py --checkpoint "$RUNNER_TEMP/ag-recovery/checkpoint.enc" --original "$RUNNER_TEMP/ag-original/checkpoint.enc" --run "$PRIOR" --output "$RUNNER_TEMP/recovery-diagnostics.json"
      - uses: actions/upload-artifact@v7
        with:
          name: ag003-recovery-diagnostics
          path: ${{ runner.temp }}/recovery-diagnostics.json
          retention-days: 7
          if-no-files-found: error
