name: Antigravity independent reproduction
on:
  pull_request:
    paths:
      - 'antigravity/reproduction/AG-PHOTONIC-001/reproduce.py'
      - 'antigravity/reproduction/AG-PHOTONIC-001/reference.json'
      - 'antigravity/reproduction/AG-PHOTONIC-001/original/coupler.ctl'
      - '.github/workflows/antigravity-reproduction.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y mpb
      - name: Reproduce MPB results
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python3 antigravity/reproduction/AG-PHOTONIC-001/reproduce.py reproduction.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: AG-PHOTONIC-001-independent-reproduction
          path: reproduction.json
          if-no-files-found: warn
