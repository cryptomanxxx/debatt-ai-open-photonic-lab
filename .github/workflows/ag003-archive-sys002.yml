name: AG003 archive SYS002 evidence
on:
  workflow_dispatch:
    inputs:
      confirm_archive:
        description: Archive exact SYS002 evidence to a separate review branch
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: ag003-sys002-archive
  cancel-in-progress: false
jobs:
  archive:
    if: github.ref == 'refs/heads/main' && inputs.confirm_archive == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ROOT: antigravity/reproduction/AG-PHOTONIC-003
      ARCHIVE_BRANCH: research/ag003-sys002-44106677587
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify run and artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44106677587" |
            jq -e '.path == ".github/workflows/experiments.yml" and .head_branch == "research/ag003-pump-fanout" and .event == "pull_request" and .conclusion == "success" and .head_sha == "1e9776b3c705b0cd6d4e279d93e10855b39bcf24"' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14337483644" |
            jq -e '.name == "opa-sys-002" and .expired == false and .workflow_run.id == 44106677587 and .digest == "sha256:9f4441e22cc2f7547ed8f4c9f2df5e904d35e20ce3ebfd5d7f031147d4a48a06" and .size_in_bytes == 218777' >/dev/null
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: 14337483644
          run-id: 44106677587
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ag003-sys002-evidence
          merge-multiple: true
      - name: Verify exact artifact files
        run: |
          python3 "$ROOT/archive_sys002.py" --source "$RUNNER_TEMP/ag003-sys002-evidence" --output results/opa-sys-002
      - name: Archive to separate review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          if git ls-remote --exit-code --heads origin "refs/heads/$ARCHIVE_BRANCH" >/dev/null; then
            echo "Archive branch exists; refusing overwrite."
            exit 1
          else
            status=$?
            [[ "$status" == 2 ]]
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$ARCHIVE_BRANCH"
          git -c core.autocrlf=false add -f -- results/opa-sys-002
          stage="$RUNNER_TEMP/ag003-sys002-staged"
          mkdir "$stage"
          for file in results/opa-sys-002/*; do
            git show ":$file" > "$stage/$(basename "$file")"
          done
          python3 "$ROOT/archive_sys002.py" --source "$stage" --staged
          git commit -m "Archive exact OPA-SYS-002 evidence from run 44106677587"
          git push origin "HEAD:refs/heads/$ARCHIVE_BRANCH"
          echo "Review branch: https://github.com/$GITHUB_REPOSITORY/compare/main...$ARCHIVE_BRANCH" >> "$GITHUB_STEP_SUMMARY"
