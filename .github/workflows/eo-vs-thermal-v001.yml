name: OPA Pockels vs thermo-optic v001

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/eo-vs-thermal-v001.yml"
      - "simulations/meep/eo_vs_thermal_v001.py"
      - "simulations/circuit/mesh.py"
      - "simulations/circuit/mzi.py"
      - "simulations/meep/opa-fdtd-linux-64.lock.txt"

permissions:
  contents: read

jobs:
  eo-vs-thermal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: micromamba-shell {0}
    steps:
      - uses: actions/checkout@v4
      - name: Install locked Meep
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: opa-fdtd
          create-args: >-
            --file simulations/meep/opa-fdtd-linux-64.lock.txt
      - name: Archive environment provenance
        run: |
          mkdir -p results/opa-eo-001
          cp simulations/meep/opa-fdtd-linux-64.lock.txt results/opa-eo-001/environment-lock.txt
          micromamba list -n opa-fdtd --json > results/opa-eo-001/installed-packages.json
      - name: Run Pockels vs thermo-optic comparison
        run: python simulations/meep/eo_vs_thermal_v001.py
      - name: Print result
        if: always()
        run: cat results/opa-eo-001/result.json
      - name: Upload measurement results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opa-eo-001
          path: results/opa-eo-001/
          if-no-files-found: warn
