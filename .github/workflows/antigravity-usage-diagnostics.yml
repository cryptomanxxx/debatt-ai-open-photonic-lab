name: Antigravity usage diagnostics
on:
  workflow_dispatch:
    inputs:
      confirm_public_metadata:
        description: Publish numeric usage and fixed status metadata from encrypted archives
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  diagnostics:
    if: github.ref == 'refs/heads/main' && inputs.confirm_public_metadata == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y python3-cryptography
      - run: /usr/bin/python3 -m unittest discover -s antigravity/tests
      - name: Fetch encrypted archive
        run: |
          git fetch origin refs/heads/antigravity-archive
          git worktree add --detach "$RUNNER_TEMP/archive-tree" FETCH_HEAD
      - name: Extract diagnostic metadata
        env:
          AG_ARCHIVE_KEY: ${{ secrets.AG_ARCHIVE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/usage"
          root="$RUNNER_TEMP/archive-tree/antigravity/archive"
          /usr/bin/python3 - "$root/index.json" <<'PY' > "$RUNNER_TEMP/runs.tsv"
          import json, re, sys
          index = json.load(open(sys.argv[1]))
          for exp in ("AG-PHOTONIC-001", "AG-PHOTONIC-002", "AG-PHOTONIC-003", "AG-INFRA-001"):
              for run in index.get(exp, {}):
                  if not re.fullmatch(r"[0-9]+", run):
                      raise ValueError("Invalid run")
                  print(exp, run, sep="\t")
          PY
          while IFS=$'\t' read -r exp run; do
            /usr/bin/python3 antigravity/scientific_export.py --root "$root" --experiment "$exp" --run "$run" --diagnostics-only --output "$RUNNER_TEMP/usage/$exp-$run.json"
          done < "$RUNNER_TEMP/runs.tsv"
          /usr/bin/python3 - "$RUNNER_TEMP/usage" <<'PY'
          import pathlib, sys
          for path in sorted(pathlib.Path(sys.argv[1]).glob("*.json")):
              print(path.read_text())
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: antigravity-usage-diagnostics
          path: ${{ runner.temp }}/usage/*.json
          retention-days: 7
          if-no-files-found: error
