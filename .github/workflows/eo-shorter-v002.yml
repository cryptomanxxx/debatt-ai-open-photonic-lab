name: OPA shorter Pockels shifters v002

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/eo-shorter-v002.yml"
      - "simulations/meep/eo_shorter_v002.py"
      - "simulations/meep/eo_common.py"
      - "results/opa-eo-001/result.json"
      - "simulations/circuit/mesh.py"
      - "simulations/circuit/mzi.py"
      - "simulations/meep/opa-fdtd-linux-64.lock.txt"

permissions:
  contents: read

jobs:
  eo-shorter:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: micromamba-shell {0}
    steps:
      - uses: actions/checkout@v4
      - name: Install locked Meep
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: opa-fdtd
          create-args: >-
            --file simulations/meep/opa-fdtd-linux-64.lock.txt
      - name: Archive environment provenance
        run: |
          mkdir -p results/opa-eo-002
          cp simulations/meep/opa-fdtd-linux-64.lock.txt results/opa-eo-002/environment-lock.txt
          micromamba list -n opa-fdtd --json > results/opa-eo-002/installed-packages.json
      - name: Run shorter Pockels shifter study
        run: python simulations/meep/eo_shorter_v002.py
      - name: Print result
        if: always()
        run: cat results/opa-eo-002/result.json
      - name: Upload measurement results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opa-eo-002
          path: results/opa-eo-002/
          if-no-files-found: warn
