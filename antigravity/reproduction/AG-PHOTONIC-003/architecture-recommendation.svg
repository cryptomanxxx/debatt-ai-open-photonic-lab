<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
<title id="title">Debatt-AI OPA — recommended research architecture</title>
<desc id="desc">Conceptual block diagram of the six-bit hybrid comb headroom candidate and eight-bit independent laser reference. Not a physical chip layout.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#177e89"/></marker><marker id="digital" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs>
<rect width="1200" height="860" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#172b3a">
<text x="40" y="45" font-size="30" font-weight="bold">Debatt-AI Open Photonic Accelerator</text>
<text x="40" y="76" font-size="17">AG-PHOTONIC-003 · recommended research targets · 17 November 2026</text>
<rect x="36" y="98" width="1128" height="365" rx="14" fill="#fff" stroke="#b9cbd3"/>
<text x="56" y="132" font-size="23" font-weight="bold">A  |  Primary comb-link experiment — Hybrid 6-bit</text>
<text x="56" y="158" font-size="16" fill="#475569">8 distributed tiles · one pump, one comb, one booster per tile · 8 wavelengths per comb</text>
<rect x="56" y="180" width="1088" height="168" rx="10" fill="#ecf7f7" stroke="#8ebfc3"/>
<text x="70" y="202" font-size="13" font-weight="bold" fill="#177e89">ONE REPRESENTATIVE TILE · REPEAT ×8</text>
<rect x="70" y="219" width="112" height="89" rx="7" fill="#fff" stroke="#177e89" stroke-width="1.6"/><text x="126" y="248" text-anchor="middle" font-size="15" font-weight="bold">Pump laser</text><text x="126" y="290" text-anchor="middle" font-size="12">121.34 mW</text><rect x="205" y="219" width="130" height="89" rx="7" fill="#fff" stroke="#177e89" stroke-width="1.6"/><text x="270" y="248" text-anchor="middle" font-size="15" font-weight="bold">SiN comb</text><text x="270" y="290" text-anchor="middle" font-size="12">8 wavelengths</text><rect x="358" y="219" width="115" height="89" rx="7" fill="#fff" stroke="#177e89" stroke-width="1.6"/><text x="415.5" y="248" text-anchor="middle" font-size="15" font-weight="bold">Booster</text><text x="415.5" y="290" text-anchor="middle" font-size="12">15 dB</text><rect x="496" y="219" width="143" height="89" rx="7" fill="#fff" stroke="#177e89" stroke-width="1.6"/><text x="567.5" y="248" text-anchor="middle" font-size="15" font-weight="bold">WDM routing</text><text x="567.5" y="290" text-anchor="middle" font-size="12">4 spatial lanes</text><rect x="662" y="219" width="156" height="89" rx="7" fill="#fff" stroke="#177e89" stroke-width="1.6"/><text x="740" y="248" text-anchor="middle" font-size="15" font-weight="bold">Modulators</text><text x="740" y="290" text-anchor="middle" font-size="12">DAC / input</text><rect x="841" y="219" width="150" height="89" rx="7" fill="#fff" stroke="#177e89" stroke-width="1.6"/><text x="916" y="248" text-anchor="middle" font-size="15" font-weight="bold">Hybrid core</text><text x="916" y="290" text-anchor="middle" font-size="12">4×4 MZI/MRR</text><rect x="1014" y="219" width="116" height="89" rx="7" fill="#fff" stroke="#177e89" stroke-width="1.6"/><text x="1072" y="248" text-anchor="middle" font-size="15" font-weight="bold">Receiver</text><text x="1072" y="290" text-anchor="middle" font-size="12">PD / TIA / ADC</text>
<circle cx="270" cy="267" r="11" fill="none" stroke="#177e89" stroke-width="2.5"/><path d="M253 281H288" stroke="#177e89" stroke-width="2"/>
<path d="M398 257V277L424 267Z" fill="#177e89"/>
<path d="M866 257l7 12l7 -12 M866 269l7 -12l7 12" fill="none" stroke="#177e89" stroke-width="1.6"/><path d="M889 257l7 12l7 -12 M889 269l7 -12l7 12" fill="none" stroke="#177e89" stroke-width="1.6"/><path d="M912 257l7 12l7 -12 M912 269l7 -12l7 12" fill="none" stroke="#177e89" stroke-width="1.6"/><path d="M935 257l7 12l7 -12 M935 269l7 -12l7 12" fill="none" stroke="#177e89" stroke-width="1.6"/>
<path d="M182 267H201" stroke="#177e89" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M335 267H354" stroke="#177e89" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M473 267H492" stroke="#177e89" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M639 267H658" stroke="#177e89" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M818 267H837" stroke="#177e89" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M991 267H1010" stroke="#177e89" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M473 250H492" stroke="#ad3658" stroke-width="1.7"/><path d="M473 255H492" stroke="#db8130" stroke-width="1.7"/><path d="M473 260H492" stroke="#ac9a22" stroke-width="1.7"/><path d="M473 265H492" stroke="#25865e" stroke-width="1.7"/><path d="M473 270H492" stroke="#1686a0" stroke-width="1.7"/><path d="M473 275H492" stroke="#3465b0" stroke-width="1.7"/><path d="M473 280H492" stroke="#7652b5" stroke-width="1.7"/><path d="M473 285H492" stroke="#b34994" stroke-width="1.7"/>
<text x="70" y="332" font-size="13" fill="#475569">Optical path schematic: coupling, pump rejection, splitting, demux and balanced detection are lumped; order and routing require design.</text>
<text x="56" y="374" font-size="16" font-weight="bold">108.15 mW in-band output / booster · 56.74% nominal headroom · survives 200 mW cap in model</text>
<text x="56" y="402" font-size="16">30.529 TOPS  |  34.792 W  |  0.8775 TOPS/W  |  53.04 mm²  — modeled system / area</text>
<text x="56" y="430" font-size="15" fill="#9a5b16">Toy training: 90.39% mean, 89.50% worst seed — fails all-seed convergence gate.</text>
<rect x="36" y="480" width="1128" height="210" rx="14" fill="#fff" stroke="#b9cbd3"/>
<text x="56" y="513" font-size="23" font-weight="bold">B  |  Numerical reference — Independent-laser MZI 8-bit</text>
<text x="56" y="538" font-size="15">16 distributed tiles · 8 individual wavelength lasers per tile · 128 lasers total · no booster or comb</text>
<rect x="70" y="552" width="220" height="65" rx="7" fill="#eef5ff" stroke="#5276a5"/><text x="180" y="579" text-anchor="middle" font-size="16" font-weight="bold">8 wavelength lasers</text><text x="180" y="600" text-anchor="middle" font-size="13">per tile</text><rect x="328" y="552" width="185" height="65" rx="7" fill="#eef5ff" stroke="#5276a5"/><text x="420.5" y="579" text-anchor="middle" font-size="16" font-weight="bold">WDM / modulators</text><text x="420.5" y="600" text-anchor="middle" font-size="13">8 spatial lanes</text><rect x="551" y="552" width="210" height="65" rx="7" fill="#eef5ff" stroke="#5276a5"/><text x="656" y="579" text-anchor="middle" font-size="16" font-weight="bold">8×8 MZI</text><text x="656" y="600" text-anchor="middle" font-size="13">TFLN phase control</text><rect x="799" y="552" width="180" height="65" rx="7" fill="#eef5ff" stroke="#5276a5"/><text x="889" y="579" text-anchor="middle" font-size="16" font-weight="bold">PD / TIA / ADC</text><text x="889" y="600" text-anchor="middle" font-size="13">balanced readout</text>
<path d="M290 584H324" stroke="#177e89" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M513 584H547" stroke="#177e89" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M761 584H795" stroke="#177e89" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1000" y="589" font-size="15" font-weight="bold">×16 tiles</text>
<text x="56" y="642" font-size="15">244.234 TOPS  |  384.088 W  |  0.6359 TOPS/W  |  243.52 mm² — modeled</text>
<text x="56" y="669" font-size="15" fill="#176b52">Toy training: 93.83% mean, 91.67% worst seed — passes nominal and moderate-stress gates.</text>
<rect x="36" y="708" width="1128" height="105" rx="12" fill="#e7edf4" stroke="#94a3b8"/>
<text x="56" y="735" font-size="19" font-weight="bold">Shared electronic subsystem (either architecture)</text>
<text x="56" y="760" font-size="16">HBM / SRAM · master weights · DAC drivers · electronic activation, weight gradients and Adam · control / calibration</text>
<text x="56" y="785" font-size="14" fill="#475569">Optical MVM forward + modeled activation-gradient MVM; electronic weight updates. No fully optical training claim.</text>
<text x="40" y="841" font-size="14" font-weight="bold" fill="#475569">Concept only · not GDS, not foundry-validated, not measured hardware · no verified system advantage over 3.5 TOPS/W reference</text>
</g></svg>
