name: AG003 archive SYS004 evidence
on:
  workflow_dispatch:
    inputs:
      confirm_archive:
        description: Archive exact SYS004 evidence to a separate review branch
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: ag003-sys004-archive
  cancel-in-progress: false
jobs:
  archive:
    if: github.ref == 'refs/heads/main' && inputs.confirm_archive == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ROOT: antigravity/reproduction/AG-PHOTONIC-003
      ARCHIVE_BRANCH: research/ag003-sys004-44113634095
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify run and artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44113634095" |
            jq -e '.path == ".github/workflows/experiments.yml" and .head_branch == "research/opa-sys-004-receiver" and .event == "pull_request" and .conclusion == "success" and .head_sha == "a9e88dc885d48e596f5684631a5468caabcc1f28"' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14340214791" |
            jq -e '.name == "opa-sys-004" and .expired == false and .workflow_run.id == 44113634095 and .digest == "sha256:1bd2c6b94eb2acbb0a2b51cdc7f1b8ee26bd4dba075f8cb12e75d589dd821ef3" and .size_in_bytes == 482695' >/dev/null
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: 14340214791
          run-id: 44113634095
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ag003-sys004-evidence
          merge-multiple: true
      - name: Verify exact artifact files
        run: |
          python3 "$ROOT/archive_sys004.py" --source "$RUNNER_TEMP/ag003-sys004-evidence" --output results/opa-sys-004
      - name: Archive to separate review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          if git ls-remote --exit-code --heads origin "refs/heads/$ARCHIVE_BRANCH" >/dev/null; then
            echo "Archive branch exists; refusing overwrite."
            exit 1
          else
            status=$?
            [[ "$status" == 2 ]]
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$ARCHIVE_BRANCH"
          git -c core.autocrlf=false add -f -- results/opa-sys-004
          stage="$RUNNER_TEMP/ag003-sys004-staged"
          mkdir "$stage"
          for file in results/opa-sys-004/*; do
            git show ":$file" > "$stage/$(basename "$file")"
          done
          python3 "$ROOT/archive_sys004.py" --source "$stage" --staged
          git commit -m "Archive exact OPA-SYS-004 evidence from run 44113634095"
          git push origin "HEAD:refs/heads/$ARCHIVE_BRANCH"
          echo "Review branch: https://github.com/$GITHUB_REPOSITORY/compare/main...$ARCHIVE_BRANCH" >> "$GITHUB_STEP_SUMMARY"
