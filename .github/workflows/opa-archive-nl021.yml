name: OPA archive NL021 evidence
on:
  workflow_dispatch:
    inputs:
      confirm_archive:
        description: Archive verified NL021 evidence to a separate review branch
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: opa-nl021-archive
  cancel-in-progress: false
jobs:
  archive:
    if: github.ref == 'refs/heads/main' && inputs.confirm_archive == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ARCHIVE_BRANCH: research/opa-nl021-44504831351
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify run and artifact identity
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44504831351" |
            jq -e '.path == ".github/workflows/experiments.yml" and .head_branch == "opa-nl-021-final-confirmation" and .event == "pull_request" and .conclusion == "success" and .head_sha == "ad5ccd6e849715de19a74d9338bf44d506f51cc3"' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14519955758" |
            jq -e '.name == "opa-nl-021" and .expired == false and .workflow_run.id == 44504831351 and .digest == "sha256:b728cc934b003e44dd6ccfa3543e0ca16aa3f382b8bd370ad2a91b427df80a69" and .size_in_bytes == 326958' >/dev/null
      - name: Download and verify raw ZIP
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14519955758/zip" > "$RUNNER_TEMP/nl021.zip"
          python3 research/archive_nl021.py --zip "$RUNNER_TEMP/nl021.zip" --output results/opa-nl-021
      - name: Archive to separate review branch
        run: |
          gh auth setup-git
          if git ls-remote --exit-code --heads origin "refs/heads/$ARCHIVE_BRANCH" >/dev/null; then
            echo "Archive branch exists; refusing overwrite."
            exit 1
          else
            status=$?
            [[ "$status" == 2 ]]
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$ARCHIVE_BRANCH"
          git -c core.autocrlf=false add -f -- results/opa-nl-021
          stage="$RUNNER_TEMP/nl021-staged"
          mkdir "$stage"
          for file in results/opa-nl-021/*; do
            git show ":$file" > "$stage/$(basename "$file")"
          done
          python3 research/archive_nl021.py --zip "$RUNNER_TEMP/nl021.zip" --staged "$stage"
          git commit -m "Archive exact OPA-NL-021 evidence from run 44504831351"
          git push origin "HEAD:refs/heads/$ARCHIVE_BRANCH"
          echo "Review branch: https://github.com/$GITHUB_REPOSITORY/compare/main...$ARCHIVE_BRANCH" >> "$GITHUB_STEP_SUMMARY"
