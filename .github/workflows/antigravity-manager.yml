name: Antigravity experiment manager
on:
  workflow_dispatch:
    inputs:
      experiment:
        type: choice
        options: [AG-PHOTONIC-001, AG-INFRA-001, AG-PHOTONIC-002, AG-PHOTONIC-003]
      mode:
        type: choice
        options: [retrieve, import, start, continue, budget-probe]
        default: retrieve
      prior_run_id:
        description: Optional historical run ID; blank selects latest checkpoint
        type: string
      expected_interaction_hash:
        description: Optional SHA256 binding for webhook retrieval
        type: string
      token_budget:
        description: 20000 to 1000000; budget-probe requires 1000000
        type: number
        default: 20000
      poll_until_done:
        description: Poll existing interaction every 5 minutes for up to 12 checks
        type: boolean
        default: false
      dynamic_webhook:
        description: Diagnostic callback (AG-INFRA-001 start, 20000 tokens only)
        type: boolean
        default: false
      confirm_new_submission:
        type: boolean
        default: false
      confirm_free_project:
        description: I verified Free Tier and billing disabled
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: antigravity-live-probe
  cancel-in-progress: false
jobs:
  manager:
    if: github.ref == 'refs/heads/main' && inputs.confirm_free_project == true && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate inputs
        env:
          MODE: ${{ inputs.mode }}
          PRIOR: ${{ inputs.prior_run_id }}
          CONFIRM: ${{ inputs.confirm_new_submission }}
        run: |
          if [[ "$MODE" == continue ]]; then
            [[ "$PRIOR" =~ ^[0-9]+$ ]]
          elif [[ "$MODE" == retrieve ]]; then
            [[ -z "$PRIOR" || "$PRIOR" =~ ^[0-9]+$ ]]
          else
            [[ -z "$PRIOR" ]]
          fi
          if [[ "$MODE" == start || "$MODE" == continue || "$MODE" == budget-probe ]]; then
            [[ "$CONFIRM" == true ]]
          fi
      - name: Install encryption dependency
        run: sudo apt-get update -qq && sudo apt-get install -y python3-cryptography
      - run: /usr/bin/python3 -m unittest discover -s antigravity/tests
      - name: Select checkpoint
        id: checkpoint
        if: (inputs.mode == 'retrieve' || inputs.mode == 'continue')
        env:
          GH_TOKEN: ${{ github.token }}
          EXPERIMENT: ${{ inputs.experiment }}
          PRIOR: ${{ inputs.prior_run_id }}
        run: /usr/bin/python3 antigravity/checkpoints.py --experiment "$EXPERIMENT" --prior "$PRIOR"
      - uses: actions/download-artifact@v7
        if: (inputs.mode == 'retrieve' || inputs.mode == 'continue') && steps.checkpoint.outputs.archive != 'true'
        with:
          name: ${{ steps.checkpoint.outputs.artifact_name }}
          run-id: ${{ steps.checkpoint.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ag-prior
      - name: Restore permanent checkpoint
        if: (inputs.mode == 'retrieve' || inputs.mode == 'continue') && steps.checkpoint.outputs.archive == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AG_ARCHIVE_KEY: ${{ secrets.AG_ARCHIVE_KEY }}
          EXPERIMENT: ${{ inputs.experiment }}
        run: |
          git fetch origin refs/heads/antigravity-archive
          git worktree add --detach "$RUNNER_TEMP/archive-tree" FETCH_HEAD
          /usr/bin/python3 antigravity/archive.py restore --root "$RUNNER_TEMP/archive-tree/antigravity/archive" --experiment "$EXPERIMENT" --file "$RUNNER_TEMP/ag-prior/checkpoint.enc"
      - name: Execute one operation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AG_RETRIEVE_INTERACTION_ID: ${{ secrets.AG_RETRIEVE_INTERACTION_ID }}
          MODE: ${{ inputs.mode }}
          EXPERIMENT: ${{ inputs.experiment }}
          BUDGET: ${{ inputs.token_budget }}
          POLL: ${{ inputs.poll_until_done }}
          DYNAMIC_WEBHOOK: ${{ inputs.dynamic_webhook }}
          EXPECTED_HASH: ${{ inputs.expected_interaction_hash }}
          CONFIRM: ${{ inputs.confirm_new_submission }}
        run: |
          args=()
          if [[ "$POLL" == true ]]; then
            [[ "$MODE" == start || "$MODE" == retrieve || "$MODE" == continue ]]
            [[ "$DYNAMIC_WEBHOOK" != true ]]
            args+=(--poll)
          fi
          if [[ "$DYNAMIC_WEBHOOK" == true ]]; then
            [[ "$MODE" == start && "$EXPERIMENT" == AG-INFRA-001 && "$BUDGET" == 20000 ]]
            args+=(--dynamic-webhook)
          fi
          if [[ -n "$EXPECTED_HASH" ]]; then
            [[ "$MODE" == retrieve && "$EXPECTED_HASH" =~ ^[a-f0-9]{64}$ ]]
            /usr/bin/python3 -c 'import sys,os,hashlib; from pathlib import Path; sys.path.insert(0,"antigravity"); import manager; r=manager.load(os.environ["GEMINI_API_KEY"],os.environ["EXPERIMENT"],Path(os.environ["RUNNER_TEMP"])/"ag-prior/checkpoint.enc"); sys.exit(0 if hashlib.sha256(r["id"].encode()).hexdigest()==os.environ["EXPECTED_HASH"] else 1)'
          fi
          if [[ "$MODE" == retrieve || "$MODE" == continue ]]; then
            args+=(--prior "$RUNNER_TEMP/ag-prior/checkpoint.enc")
          fi
          if [[ "$CONFIRM" == true ]]; then
            args+=(--allow-submit)
          fi
          /usr/bin/python3 antigravity/manager.py --experiment "$EXPERIMENT" --mode "$MODE" --budget "$BUDGET" --output "$RUNNER_TEMP/ag-output/checkpoint.enc" --confirm-free-project "${args[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: antigravity-encrypted-checkpoint-${{ inputs.experiment }}
          path: ${{ runner.temp }}/ag-output/checkpoint.enc
          retention-days: 90
          if-no-files-found: warn
