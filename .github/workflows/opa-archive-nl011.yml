name: OPA archive NL011 evidence
on:
  workflow_dispatch:
    inputs:
      confirm_archive:
        description: Archive verified NL011 evidence to a separate review branch
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: opa-nl011-archive
  cancel-in-progress: false
jobs:
  archive:
    if: github.ref == 'refs/heads/main' && inputs.confirm_archive == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ARCHIVE_BRANCH: research/opa-nl011-44288710042
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify run and artifact identity
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44288710042" |
            jq -e '.path == ".github/workflows/experiments.yml" and .head_branch == "research/opa-nl-011" and .event == "pull_request" and .conclusion == "success" and .head_sha == "eed16eda29886fc22c043aa4a1c435f9950493b2"' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14421271696" |
            jq -e '.name == "opa-nl-011" and .expired == false and .workflow_run.id == 44288710042 and .digest == "sha256:89ce5da2a5000e58dc67fcd121ee2e0d7801d5048af9806ebdf3033ab47e19b2" and .size_in_bytes == 2132487' >/dev/null
      - name: Download and verify raw ZIP
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14421271696/zip" > "$RUNNER_TEMP/nl011.zip"
          python3 research/archive_nl011.py --zip "$RUNNER_TEMP/nl011.zip" --output results/opa-nl-011
      - name: Archive to separate review branch
        run: |
          gh auth setup-git
          if git ls-remote --exit-code --heads origin "refs/heads/$ARCHIVE_BRANCH" >/dev/null; then
            echo "Archive branch exists; refusing overwrite."
            exit 1
          else
            status=$?
            [[ "$status" == 2 ]]
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$ARCHIVE_BRANCH"
          git -c core.autocrlf=false add -f -- results/opa-nl-011
          stage="$RUNNER_TEMP/nl011-staged"
          mkdir "$stage"
          for file in results/opa-nl-011/*; do
            git show ":$file" > "$stage/$(basename "$file")"
          done
          python3 research/archive_nl011.py --zip "$RUNNER_TEMP/nl011.zip" --staged "$stage"
          git commit -m "Archive exact OPA-NL-011 evidence from run 44288710042"
          git push origin "HEAD:refs/heads/$ARCHIVE_BRANCH"
          echo "Review branch: https://github.com/$GITHUB_REPOSITORY/compare/main...$ARCHIVE_BRANCH" >> "$GITHUB_STEP_SUMMARY"
