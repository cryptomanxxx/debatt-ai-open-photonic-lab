name: OPA directional coupler v001

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/meep-coupler-v001.yml"
      - "simulations/meep/directional_coupler_v001.py"
      - "simulations/meep/opa-fdtd-linux-64.lock.txt"

permissions:
  contents: read

jobs:
  coupler-supermodes:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: micromamba-shell {0}
    steps:
      - uses: actions/checkout@v4
      - name: Install locked Meep
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: opa-fdtd
          create-args: >-
            --file simulations/meep/opa-fdtd-linux-64.lock.txt
      - name: Archive environment provenance
        run: |
          mkdir -p results/opa-coupler-001
          cp simulations/meep/opa-fdtd-linux-64.lock.txt results/opa-coupler-001/environment-lock.txt
          micromamba list -n opa-fdtd --json > results/opa-coupler-001/installed-packages.json
      - name: Run coupler supermode analysis
        run: python simulations/meep/directional_coupler_v001.py
      - name: Upload measurement results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opa-coupler-001
          path: results/opa-coupler-001/
          if-no-files-found: warn
