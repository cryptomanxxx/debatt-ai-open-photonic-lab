name: OPA LIB005-B passive test planning audit
on:
  pull_request:
    paths:
      - 'components/comparison/lib005-passive-test-plan.json'
      - 'tools/audit_lib005_passive.py'
      - '.github/workflows/opa-lib005-passive.yml'
      - 'research/OPA-LIB-005-B.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: python3 tools/audit_lib005_passive.py
      - uses: actions/upload-artifact@v7
        with:
          name: opa-lib-005-b
          path: results/opa-lib-005-b/
          if-no-files-found: error
