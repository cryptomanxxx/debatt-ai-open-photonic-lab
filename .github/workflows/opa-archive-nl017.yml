name: OPA archive NL017 evidence
on:
  workflow_dispatch:
    inputs:
      confirm_archive:
        description: Archive verified NL017 evidence to a separate review branch
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: opa-nl017-archive
  cancel-in-progress: false
jobs:
  archive:
    if: github.ref == 'refs/heads/main' && inputs.confirm_archive == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ARCHIVE_BRANCH: research/opa-nl017-44350128879
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify run and artifact identity
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44350128879" |
            jq -e '.path == ".github/workflows/experiments.yml" and .head_branch == "research/opa-nl-017" and .event == "pull_request" and .conclusion == "success" and .head_sha == "eb312013bb8e63035d4aed471ad14f73dfa523a9"' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14448662570" |
            jq -e '.name == "opa-nl-017" and .expired == false and .workflow_run.id == 44350128879 and .digest == "sha256:f66c6fb132af365fb4f96cf938891eb58314ad65c92a553e1df6a0ae065a571d" and .size_in_bytes == 411265' >/dev/null
      - name: Download and verify raw ZIP
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14448662570/zip" > "$RUNNER_TEMP/nl017.zip"
          python3 research/archive_nl017.py --zip "$RUNNER_TEMP/nl017.zip" --output results/opa-nl-017
      - name: Archive to separate review branch
        run: |
          gh auth setup-git
          if git ls-remote --exit-code --heads origin "refs/heads/$ARCHIVE_BRANCH" >/dev/null; then
            echo "Archive branch exists; refusing overwrite."
            exit 1
          else
            status=$?
            [[ "$status" == 2 ]]
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$ARCHIVE_BRANCH"
          git -c core.autocrlf=false add -f -- results/opa-nl-017
          stage="$RUNNER_TEMP/nl017-staged"
          mkdir "$stage"
          for file in results/opa-nl-017/*; do
            git show ":$file" > "$stage/$(basename "$file")"
          done
          python3 research/archive_nl017.py --zip "$RUNNER_TEMP/nl017.zip" --staged "$stage"
          git commit -m "Archive exact OPA-NL-017 evidence from run 44350128879"
          git push origin "HEAD:refs/heads/$ARCHIVE_BRANCH"
          echo "Review branch: https://github.com/$GITHUB_REPOSITORY/compare/main...$ARCHIVE_BRANCH" >> "$GITHUB_STEP_SUMMARY"
