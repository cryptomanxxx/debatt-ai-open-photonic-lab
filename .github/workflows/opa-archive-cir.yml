name: OPA archive CIR001-008 evidence
on:
  workflow_dispatch:
    inputs:
      confirm_archive:
        description: Archive exact eight CIR artifacts to a separate review branch
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: opa-cir-archive
  cancel-in-progress: false
jobs:
  archive:
    if: github.ref == 'refs/heads/main' && inputs.confirm_archive == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      ARCHIVE_BRANCH: research/opa-cir001-008-evidence
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify metadata and fetch exact artifacts
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/cir-zips"
          while IFS= read -r row; do
            run=$(jq -r .run <<< "$row")
            artifact=$(jq -r .artifact <<< "$row")
            name=$(jq -r .name <<< "$row")
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" | jq -e --argjson m "$row" '.conclusion == "success" and .event == "pull_request" and .head_sha == $m.head and .head_branch == $m.branch and .path == $m.workflow' >/dev/null
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact" | jq -e --argjson m "$row" '.name == $m.name and .workflow_run.id == $m.run and .digest == ("sha256:" + $m.sha256) and .size_in_bytes == $m.size and .expired == false' >/dev/null
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/cir-zips/$name.zip"
          done < <(jq -c '.[]' research/cir_archive_manifest.json)
          python3 research/archive_cir.py --source "$RUNNER_TEMP/cir-zips" --output research/evidence/opa-cir
      - name: Commit verified archive to review branch
        run: |
          set -euo pipefail
          gh auth setup-git
          if git ls-remote --exit-code --heads origin "refs/heads/$ARCHIVE_BRANCH" >/dev/null; then
            echo "Archive branch exists; refusing overwrite."
            exit 1
          else
            status=$?
            [[ "$status" == 2 ]]
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$ARCHIVE_BRANCH"
          git -c core.autocrlf=false add -f -- research/evidence/opa-cir
          stage="$RUNNER_TEMP/cir-staged"
          mkdir "$stage"
          git ls-files -z -- research/evidence/opa-cir | while IFS= read -r -d '' file; do
            rel="${file#research/evidence/opa-cir/}"
            mkdir -p "$stage/$(dirname "$rel")"
            git show ":$file" > "$stage/$rel"
          done
          python3 research/archive_cir.py --source "$RUNNER_TEMP/cir-zips" --staged "$stage"
          git commit -m "Archive exact OPA-CIR-001 through 008 CI evidence"
          git push origin "HEAD:refs/heads/$ARCHIVE_BRANCH"
          echo "Review branch: https://github.com/$GITHUB_REPOSITORY/compare/main...$ARCHIVE_BRANCH" >> "$GITHUB_STEP_SUMMARY"
