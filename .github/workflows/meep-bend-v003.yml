name: OPA Meep bend radius v003

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/meep-bend-v003.yml"
      - "simulations/meep/**"
  pull_request:
    paths:
      - ".github/workflows/meep-bend-v003.yml"
      - "simulations/meep/**"

permissions:
  contents: read

jobs:
  meep-fdtd:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: micromamba-shell {0}
    steps:
      - uses: actions/checkout@v4
      - name: Install Meep from conda-forge
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: opa-fdtd
          create-args: >-
            --file simulations/meep/opa-fdtd-linux-64.lock.txt
      - name: Save exact environment provenance
        run: |
          mkdir -p results/opa-fdtd-003
          cp simulations/meep/opa-fdtd-linux-64.lock.txt results/opa-fdtd-003/environment-lock.txt
          micromamba list -n opa-fdtd --json > results/opa-fdtd-003/installed-packages.json
      - name: Run OPA-FDTD-003
        run: python simulations/meep/bend_radius_v003.py
      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opa-meep-bend-v003
          path: results/opa-fdtd-003/
          if-no-files-found: warn
