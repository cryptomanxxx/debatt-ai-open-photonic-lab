name: AG003 archive verified replay
on:
  workflow_dispatch:
    inputs:
      confirm_archive:
        description: Archive exact verified replay evidence on a new review branch
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: ag003-replay-archive
  cancel-in-progress: false
jobs:
  archive:
    if: github.ref == 'refs/heads/main' && inputs.confirm_archive == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ROOT: antigravity/reproduction/AG-PHOTONIC-003
      ARCHIVE_BRANCH: research/ag003-replay-44090316677
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify run and artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44090316677" |
            jq -e '.path == ".github/workflows/ag003-isolated-replay.yml" and .head_branch == "main" and .event == "workflow_dispatch" and .conclusion == "success" and .head_sha == "c682278bcace3eb3efd4eaba399ecda3311f1d79"' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14331995499" |
            jq -e '.name == "ag003-isolated-replay" and .expired == false and .workflow_run.id == 44090316677 and .digest == "sha256:96699acf4a2338bfbb0fe9dc92c8f3964f620f6d3a95d08c6a1522f6c94b84ce"' >/dev/null
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: 14331995499
          run-id: 44090316677
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ag003-replay-evidence
          merge-multiple: true
      - name: Verify exact bytes and recompute comparison
        run: |
          python3 "$ROOT/archive_replay.py" --source "$RUNNER_TEMP/ag003-replay-evidence" --original "$ROOT/original" --output "$ROOT/replay-44090316677"
      - name: Archive to separate review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          if git ls-remote --exit-code --heads origin "refs/heads/$ARCHIVE_BRANCH" >/dev/null; then
            echo "Archive branch exists; refusing overwrite."
            exit 1
          else
            status=$?
            [[ "$status" == 2 ]]
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$ARCHIVE_BRANCH"
          git -c core.autocrlf=false add -f -- "$ROOT/replay-44090316677"
          stage="$RUNNER_TEMP/ag003-replay-staged"
          mkdir "$stage"
          for file in "$ROOT/replay-44090316677/"*; do
            git show ":$file" > "$stage/$(basename "$file")"
          done
          python3 "$ROOT/archive_replay.py" --source "$stage" --original "$ROOT/original"
          git commit -m "Archive exact AG003 replay evidence from run 44090316677"
          git push origin "HEAD:refs/heads/$ARCHIVE_BRANCH"
          echo "Review branch: https://github.com/$GITHUB_REPOSITORY/compare/main...$ARCHIVE_BRANCH" >> "$GITHUB_STEP_SUMMARY"
