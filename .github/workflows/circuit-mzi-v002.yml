name: OPA circuit MZI imperfections v002

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/circuit-mzi-v002.yml"
      - "simulations/circuit/**"
  pull_request:
    paths:
      - ".github/workflows/circuit-mzi-v002.yml"
      - "simulations/circuit/**"
      - "simulations/meep/opa-fdtd-linux-64.lock.txt"

permissions:
  contents: read

jobs:
  mzi-imperfect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: micromamba-shell {0}
    steps:
      - uses: actions/checkout@v4
      - name: Install locked environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: opa-fdtd
          create-args: >-
            --file simulations/meep/opa-fdtd-linux-64.lock.txt
      - name: Archive environment provenance
        run: |
          mkdir -p results/opa-mzi-002
          cp simulations/meep/opa-fdtd-linux-64.lock.txt results/opa-mzi-002/environment-lock.txt
          micromamba list -n opa-fdtd --json > results/opa-mzi-002/installed-packages.json
      - name: Run OPA-MZI-002
        run: python simulations/circuit/mzi_imperfect_v002.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opa-mzi-002
          path: results/opa-mzi-002/
          if-no-files-found: warn
