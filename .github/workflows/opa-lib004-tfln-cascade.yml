name: OPA LIB004 Twente cascade analysis
on:
  pull_request:
    paths:
      - 'components/experimentally_validated/Twente-TFLN-Wei-2025/**'
      - 'tools/audit_twente_tfln_cascade.py'
      - '.github/workflows/opa-lib004-tfln-cascade.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: python3 tools/audit_twente_tfln_cascade.py
      - uses: actions/upload-artifact@v7
        with:
          name: opa-lib004-tfln-cascade
          path: results/opa-lib004-tfln-cascade/
          if-no-files-found: error
