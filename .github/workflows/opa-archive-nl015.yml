name: OPA archive NL015 evidence
on:
  workflow_dispatch:
    inputs:
      confirm_archive:
        description: Archive verified NL015 evidence to a separate review branch
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: opa-nl015-archive
  cancel-in-progress: false
jobs:
  archive:
    if: github.ref == 'refs/heads/main' && inputs.confirm_archive == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ARCHIVE_BRANCH: research/opa-nl015-44321189432
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify run and artifact identity
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44321189432" |
            jq -e '.path == ".github/workflows/experiments.yml" and .head_branch == "research/opa-nl-015" and .event == "pull_request" and .conclusion == "success" and .head_sha == "22860166d0ef7cfd22823dd3feb7518281aa6615"' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14437276291" |
            jq -e '.name == "opa-nl-015" and .expired == false and .workflow_run.id == 44321189432 and .digest == "sha256:da2b2834f27301c25bf155573086dfcf01b332c6a351729a80204b096fc27dce" and .size_in_bytes == 685440' >/dev/null
      - name: Download and verify raw ZIP
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14437276291/zip" > "$RUNNER_TEMP/nl015.zip"
          python3 research/archive_nl015.py --zip "$RUNNER_TEMP/nl015.zip" --output results/opa-nl-015
      - name: Archive to separate review branch
        run: |
          gh auth setup-git
          if git ls-remote --exit-code --heads origin "refs/heads/$ARCHIVE_BRANCH" >/dev/null; then
            echo "Archive branch exists; refusing overwrite."
            exit 1
          else
            status=$?
            [[ "$status" == 2 ]]
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$ARCHIVE_BRANCH"
          git -c core.autocrlf=false add -f -- results/opa-nl-015
          stage="$RUNNER_TEMP/nl015-staged"
          mkdir "$stage"
          for file in results/opa-nl-015/*; do
            git show ":$file" > "$stage/$(basename "$file")"
          done
          python3 research/archive_nl015.py --zip "$RUNNER_TEMP/nl015.zip" --staged "$stage"
          git commit -m "Archive exact OPA-NL-015 evidence from run 44321189432"
          git push origin "HEAD:refs/heads/$ARCHIVE_BRANCH"
          echo "Review branch: https://github.com/$GITHUB_REPOSITORY/compare/main...$ARCHIVE_BRANCH" >> "$GITHUB_STEP_SUMMARY"
