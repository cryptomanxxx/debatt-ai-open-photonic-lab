name: OPA Meep FDTD smoke v001

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/meep-smoke.yml"
      - "simulations/meep/**"
  pull_request:
    paths:
      - ".github/workflows/meep-smoke.yml"
      - "simulations/meep/**"

permissions:
  contents: read

jobs:
  meep-fdtd:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: micromamba-shell {0}
    steps:
      - uses: actions/checkout@v4
      - name: Install Meep from conda-forge
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: opa-fdtd
          create-args: >-
            --file simulations/meep/opa-fdtd-linux-64.lock.txt
       - name: Run OPA-FDTD-001
        run: python simulations/meep/smoke_test_v001.py
      - name: Save exact environment provenance
        run: |
          cp simulations/meep/opa-fdtd-linux-64.lock.txt results/meep-smoke-v001/environment-lock.txt
          micromamba list -n opa-fdtd --json > results/meep-smoke-v001/installed-packages.json
      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opa-meep-smoke-v001
          path: results/meep-smoke-v001/
          if-no-files-found: warn
