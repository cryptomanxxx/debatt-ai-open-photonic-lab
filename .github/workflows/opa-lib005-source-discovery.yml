name: OPA LIB005-C exact revision source discovery
on:
  pull_request:
    paths:
      - 'components/comparison/lib005-source-discovery.json'
      - 'tools/audit_lib005_sources.py'
      - '.github/workflows/opa-lib005-source-discovery.yml'
      - 'research/OPA-LIB-005-C.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: python3 tools/audit_lib005_sources.py
      - uses: actions/upload-artifact@v7
        with:
          name: opa-lib-005-c
          path: results/opa-lib-005-c/
          if-no-files-found: error
