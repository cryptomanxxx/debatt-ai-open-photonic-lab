name: OPA archive NL003 evidence
on:
  workflow_dispatch:
    inputs:
      confirm_archive:
        description: Archive verified NL003 evidence to a separate review branch
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: opa-nl003-archive
  cancel-in-progress: false
jobs:
  archive:
    if: github.ref == 'refs/heads/main' && inputs.confirm_archive == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ARCHIVE_BRANCH: research/opa-nl003-44163676304
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify run and artifact identity
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44163676304" |
            jq -e '.path == ".github/workflows/experiments.yml" and .head_branch == "research/opa-nl-003" and .event == "pull_request" and .conclusion == "success" and .head_sha == "796d6e3874aed72394e9d3ede22a607e9c998e46"' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14364861512" |
            jq -e '.name == "opa-nl-003" and .expired == false and .workflow_run.id == 44163676304 and .digest == "sha256:aa85eab11f7af5c5bd52a147b241083f85c622038e8d0a7991470e3c61e19ba6" and .size_in_bytes == 117695' >/dev/null
      - name: Download and verify raw ZIP
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14364861512/zip" > "$RUNNER_TEMP/nl003.zip"
          python3 research/archive_nl003.py --zip "$RUNNER_TEMP/nl003.zip" --output results/opa-nl-003
      - name: Archive to separate review branch
        run: |
          gh auth setup-git
          if git ls-remote --exit-code --heads origin "refs/heads/$ARCHIVE_BRANCH" >/dev/null; then
            echo "Archive branch exists; refusing overwrite."
            exit 1
          else
            status=$?
            [[ "$status" == 2 ]]
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$ARCHIVE_BRANCH"
          git -c core.autocrlf=false add -f -- results/opa-nl-003
          stage="$RUNNER_TEMP/nl003-staged"
          mkdir "$stage"
          for file in results/opa-nl-003/*; do
            git show ":$file" > "$stage/$(basename "$file")"
          done
          python3 research/archive_nl003.py --zip "$RUNNER_TEMP/nl003.zip" --staged "$stage"
          git commit -m "Archive exact OPA-NL-003 evidence from run 44163676304"
          git push origin "HEAD:refs/heads/$ARCHIVE_BRANCH"
          echo "Review branch: https://github.com/$GITHUB_REPOSITORY/compare/main...$ARCHIVE_BRANCH" >> "$GITHUB_STEP_SUMMARY"
