name: OPA archive NL018 evidence
on:
  workflow_dispatch:
    inputs:
      confirm_archive:
        description: Archive verified NL018 evidence to a separate review branch
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: opa-nl018-archive
  cancel-in-progress: false
jobs:
  archive:
    if: github.ref == 'refs/heads/main' && inputs.confirm_archive == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ARCHIVE_BRANCH: research/opa-nl018-44387159815
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify run and artifact identity
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44387159815" |
            jq -e '.path == ".github/workflows/experiments.yml" and .head_branch == "research/opa-nl-018" and .event == "pull_request" and .conclusion == "success" and .head_sha == "3695dcc663f08fe6a7d04def6735b383fe2aab06"' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14467183137" |
            jq -e '.name == "opa-nl-018" and .expired == false and .workflow_run.id == 44387159815 and .digest == "sha256:5056ec8c3e7ffb398184c320b653ca4c4c200510fac76c58d9eb8f2f2ec9276d" and .size_in_bytes == 344108' >/dev/null
      - name: Download and verify raw ZIP
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14467183137/zip" > "$RUNNER_TEMP/nl018.zip"
          python3 research/archive_nl018.py --zip "$RUNNER_TEMP/nl018.zip" --output results/opa-nl-018
      - name: Archive to separate review branch
        run: |
          gh auth setup-git
          if git ls-remote --exit-code --heads origin "refs/heads/$ARCHIVE_BRANCH" >/dev/null; then
            echo "Archive branch exists; refusing overwrite."
            exit 1
          else
            status=$?
            [[ "$status" == 2 ]]
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$ARCHIVE_BRANCH"
          git -c core.autocrlf=false add -f -- results/opa-nl-018
          stage="$RUNNER_TEMP/nl018-staged"
          mkdir "$stage"
          for file in results/opa-nl-018/*; do
            git show ":$file" > "$stage/$(basename "$file")"
          done
          python3 research/archive_nl018.py --zip "$RUNNER_TEMP/nl018.zip" --staged "$stage"
          git commit -m "Archive exact OPA-NL-018 evidence from run 44387159815"
          git push origin "HEAD:refs/heads/$ARCHIVE_BRANCH"
          echo "Review branch: https://github.com/$GITHUB_REPOSITORY/compare/main...$ARCHIVE_BRANCH" >> "$GITHUB_STEP_SUMMARY"
