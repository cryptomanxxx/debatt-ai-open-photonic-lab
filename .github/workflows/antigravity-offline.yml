name: Antigravity offline tests
on:
  pull_request:
    paths:
      - 'antigravity/**'
      - '.github/workflows/antigravity-offline.yml'
      - '.github/workflows/antigravity-live.yml'
      - '.github/workflows/antigravity-photonic.yml'
      - '.github/workflows/antigravity-resume.yml'
      - '.github/workflows/antigravity-background.yml'
      - '.github/workflows/antigravity-manager.yml'
      - '.github/workflows/antigravity-archive.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -qq && sudo apt-get install -y python3-cryptography
      - run: /usr/bin/python3 -m unittest discover -s antigravity/tests
      - run: python3 antigravity/experiments/AG-INFRA-001/probe.py

      - run: python3 antigravity/experiments/AG-PHOTONIC-001/run.py
