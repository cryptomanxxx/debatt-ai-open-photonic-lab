name: OPA layout MZI 2x2 v001

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/layout-mzi-v001.yml"
      - "layout/**"
      - "results/opa-coupler-002/result.json"
      - "results/opa-coupler-003/result.json"
  pull_request:
    paths:
      - ".github/workflows/layout-mzi-v001.yml"
      - "layout/**"
      - "results/opa-layout-001/**"
      - "simulations/meep/geometry/**"
      - "results/opa-coupler-002/result.json"
      - "results/opa-coupler-003/result.json"

permissions:
  contents: read

jobs:
  mzi-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked layout environment
        run: pip install -r layout/requirements-lock.txt
      - name: Archive environment provenance
        run: |
          mkdir -p results/opa-layout-001
          pip freeze > results/opa-layout-001/installed-packages.txt
      - name: Generate layout and run checks
        env:
          MPLBACKEND: Agg
        run: python layout/mzi_2x2_layout_v001.py
      - name: Committed GDS and datasheet match the generated ones
        run: git diff --exit-code -- results/opa-layout-001/programmable_mzi_2x2.gds results/opa-layout-001/design.json
      - name: Coupler geometry for Meep matches the layout (OPA-COUPLER-002)
        run: |
          python layout/export_coupler_geometry.py
          git diff --exit-code -- simulations/meep/geometry/coupler_gap0.236.json
      - name: Upload layout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opa-layout-001
          path: results/opa-layout-001/
          if-no-files-found: warn
